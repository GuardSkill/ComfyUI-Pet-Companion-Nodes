version = "1.0.0"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.8",
  "Pillow>=9.5",
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
  "Operating System :: OS Independent",
]

[project.urls]
